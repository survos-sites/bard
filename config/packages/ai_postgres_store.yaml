ai:
    store:
        postgres:
            # pgvector lives in the same timescaledb-ha container as everything
            # else (sites/docker), so it rides along with the existing DBAL
            # connection -- no second database, no second credential.
            scenes:
                dbal_connection: 'doctrine.dbal.default_connection'
                table_name: 'bard_scene_vector'
                vector_field: 'embedding'
                metric: 'cosine'
                lang: 'english'
                dimensions: 1536
                index_method: 'hnsw'
                index_opclass: 'vector_cosine_ops'
